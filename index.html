<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Type — Тренажер печати</title>
    <style>
        :root {
            --bg-color: #f7f6f2;
            --card-bg: #ffffff;
            --text-main: #2c2c2c;
            --text-muted: #8c8c8c;
            --accent: #5a6b5c;
            --error: #ba5c53;
            --correct: #5c8263;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 700px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .modes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .mode-btn {
            background: transparent;
            border: 1px solid #e0e0e0;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .mode-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(90, 107, 92, 0.05);
        }

        #text-display {
            font-size: 1.4rem;
            line-height: 1.8;
            letter-spacing: 0.5px;
            font-family: monospace;
            margin-bottom: 30px;
            word-break: break-all;
            background: #faf9f5;
            padding: 20px;
            border-radius: 12px;
            min-height: 80px;
        }

        .char {
            color: var(--text-muted);
        }

        .char.correct {
            color: var(--correct);
        }

        .char.incorrect {
            color: var(--error);
            background: rgba(186, 92, 83, 0.1);
        }

        .char.current {
            border-bottom: 2px solid var(--accent);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .restart-tip {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>КЛАВИАТУРНЫЙ ТРЕНАЖЕР</h1>
        
        <div class="modes">
            <button class="mode-btn active" id="btn-words" onclick="setMode('words', event)">Слова</button>
            <button class="mode-btn" id="btn-symbols" onclick="setMode('symbols', event)">Спецсимволы</button>
            <button class="mode-btn" id="btn-code" onclick="setMode('code', event)">Код / Питон</button>
        </div>

        <div id="text-display">Загрузка...</div>

        <div class="stats">
            <div>Скорость: <span id="wpm">0</span> WPM</div>
            <div>Ошибки: <span id="errors">0</span></div>
            <div>Точность: <span id="accuracy">100</span>%</div>
        </div>
    </div>

    <div class="restart-tip">Нажми <b>Tab</b> для перезапуска текста</div>

    <script>
        const textDisplay = document.getElementById('text-display');
        const wpmElement = document.getElementById('wpm');
        const errorsElement = document.getElementById('errors');
        const accuracyElement = document.getElementById('accuracy');

        const samples = {
            words: "дом кошка солнце машина облако река дорога музыка стекло письмо птица дерево книга чайник зеркало телефон занавеска",
            symbols: "a!b@c#d$e%f^g&h*i(j)k_l+m{n}o|p:q\"r<s?>t~u`v-w=x[y]z;1|2@3#4$5%6^7&8*9(0)",
            code: "def calculate_sum(a, b):\n    if a > 0:\n        return a + b\n    return [0, {}]"
        };

        let currentMode = 'words';
        let charElements = [];
        let currentIndex = 0;
        let errorsCount = 0;
        let startTime = null;
        let isFinished = false;

        function initTest() {
            textDisplay.innerHTML = '';
            currentIndex = 0;
            errorsCount = 0;
            startTime = null;
            isFinished = false;
            errorsElement.textContent = '0';
            accuracyElement.textContent = '100';
            wpmElement.textContent = '0';

            const text = samples[currentMode];
            
            for (let char of text) {
                const span = document.createElement('span');
                span.classList.add('char');
                span.textContent = char;
                textDisplay.appendChild(span);
            }

            charElements = textDisplay.querySelectorAll('.char');
            if (charElements.length > 0) {
                charElements[0].classList.add('current');
            }
        }

        function setMode(mode, e) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if (e && e.target) {
                e.target.classList.add('active');
            }
            initTest();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                initTest();
                return;
            }

            if (isFinished || (e.key.length > 1 && e.key !== 'Backspace')) return;

            if (!startTime) {
                startTime = new Date();
            }

            if (currentIndex >= charElements.length) return;

            const currentCharSpan = charElements[currentIndex];

            if (e.key === 'Backspace') {
                if (currentIndex > 0) {
                    charElements[currentIndex].classList.remove('current');
                    currentIndex--;
                    charElements[currentIndex].classList.remove('correct', 'incorrect');
                    charElements[currentIndex].classList.add('current');
                }
                return;
            }

            if (e.key === currentCharSpan.textContent) {
                currentCharSpan.classList.remove('current', 'incorrect');
                currentCharSpan.classList.add('correct');
                currentIndex++;
            } else {
                currentCharSpan.classList.remove('current');
                currentCharSpan.classList.add('incorrect');
                errorsCount++;
                currentIndex++;
                errorsElement.textContent = errorsCount;
            }

            const accuracy = Math.max(0, Math.floor(((currentIndex - errorsCount) / currentIndex) * 100));
            accuracyElement.textContent = accuracy;

            const elapsedTime = (new Date() - startTime) / 60000;
            if (elapsedTime > 0) {
                const wpm = Math.round((currentIndex / 5) / elapsedTime);
                wpmElement.textContent = wpm;
            }

            if (currentIndex < charElements.length) {
                charElements[currentIndex].classList.add('current');
            } else {
                isFinished = true;
            }
        });

        // Запуск при загрузке страницы
        initTest();
    </script>
</body>
</html>
